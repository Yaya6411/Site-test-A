# Robot hebdomadaire : met à jour data/nouveautes.json (page « Nouveautés » et étagère de l'accueil).
# Il tourne chaque lundi matin, et peut être lancé à la main depuis l'onglet Actions
# (« Mise à jour des nouveautés » → « Run workflow »).
# Important : GitHub ne lance les tâches planifiées que depuis la branche par défaut du dépôt.
name: Mise à jour des nouveautés

on:
  schedule:
    - cron: "17 4 * * 1"   # lundi 4 h 17 UTC (6 h 17 à Paris l'été)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: robots-donnees   # même groupe que le robot du classement
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/youthful-archimedes-zcrfu4

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lecteur XML pour la BnF
        run: npm install --no-save --no-package-lock @xmldom/xmldom@0.8.15

      - name: Chercher les nouveautés
        run: node scripts/robot-nouveautes.mjs
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}

      - name: Enregistrer la liste
        id: commit
        run: |
          git config user.name "Robot des nouveautés"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data livres sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Nouveautés, incontournables et pages livres : mise à jour hebdomadaire"
            git pull --rebase origin claude/youthful-archimedes-zcrfu4
            git push origin HEAD:claude/youthful-archimedes-zcrfu4
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Republier le site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

  # Sauvegarde chiffrée des avis et profils publics, gardée 90 jours (onglet Actions → ce passage → Artifacts).
  # Ne fait rien tant que le secret BACKUP_PASSWORD n'existe pas (Settings → Secrets and variables → Actions).
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/youthful-archimedes-zcrfu4

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lire et chiffrer les données publiques
        id: backup
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "Secret BACKUP_PASSWORD absent : sauvegarde ignorée."
            echo "done=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/sauvegarde-avis.mjs sauvegarde.json
          gzip -9 sauvegarde.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSWORD \
            -in sauvegarde.json.gz -out "sauvegarde-$(date -u +%Y-%m-%d).json.gz.enc"
          rm sauvegarde.json.gz
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Conserver la sauvegarde
        if: steps.backup.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-biblio-fr
          path: sauvegarde-*.json.gz.enc
          retention-days: 90
